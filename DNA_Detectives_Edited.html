<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DNA Detectives</title>
<link rel="icon" type="image/png" href="favicon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Night-shift lab console. Dark single theme (navy surfaces, one cyan accent, amber for DNA differences).
   Fully offline: system fonts only, no external files. */
:root {
  --bg: #0c1722; --bg2: #101f2e; --panel: #14273a; --line: #2a4660;
  --fg: #eef3f6; --mute: #a9bccb; --accent: #35c6d9; --accent-ink: #062a31;
  --amber: #f3b63f; --amber-ink: #2a1d00; --good: #62d89a; --good-bg: #123a2b; --bad: #f58a82; --bad-bg: #402022; --warn-bg: #3b3115;
  --display: "Trebuchet MS", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg);
  background-image: radial-gradient(circle at 1px 1px, rgba(53,198,217,.10) 1px, transparent 0); background-size: 26px 26px;
  color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 36px;
}
#app { max-width: 1120px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.mute { color: var(--mute); }
.eyebrow { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px 18px; flex-wrap: wrap; margin-bottom: 10px; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; min-width: 0; }
.brand b { font-family: var(--display); font-size: 22px; }
.brand span { font-size: 14px; color: var(--mute); }
.hud { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--bg2); padding: 4px 10px; border-radius: 6px; font-family: var(--mono); font-size: 14px; white-space: nowrap; }
.clock-icon { width: 16px; height: 16px; display: inline-block; flex: 0 0 16px; vertical-align: -3px; color: var(--accent); }
.chip.big { color: var(--accent); border-color: var(--accent); }
.link { background: none; border: 0; color: var(--mute); text-decoration: underline; padding: 6px; font-size: 14px; }
.sim { display: inline-block; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--amber); color: var(--amber); font-weight: 700; white-space: nowrap; }

.rail { position: relative; margin: 34px 0 18px; padding: 0 6px; }
.rail-line { position: absolute; left: 28px; right: 28px; top: 21px; height: 4px; background: var(--line); border-radius: 2px; }
.rail-fill { position: absolute; left: 28px; top: 21px; height: 4px; background: var(--accent); border-radius: 2px; box-shadow: 0 0 12px var(--accent); transition: width .5s ease; }
.rail-nodes { position: relative; display: flex; justify-content: space-between; }
.rn { width: 96px; text-align: center; font-size: 13px; color: var(--mute); line-height: 1.25; }
.rn i { display: grid; place-items: center; width: 28px; height: 28px; margin: 7px auto 6px; border-radius: 50%; background: var(--bg); border: 2px solid var(--line); font-style: normal; font-family: var(--mono); font-size: 13px; position: relative; z-index: 1; }
.rn.on i { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 14px rgba(53,198,217,.6); }
.rn.done i { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.rn.on { color: var(--fg); font-weight: 600; }
.cart { position: absolute; top: -2px; width: 34px; height: 18px; background: var(--amber); border-radius: 3px; transform: translateX(-50%); transition: left .5s ease; z-index: 2; box-shadow: 0 0 10px rgba(243,182,63,.5); }
.cart::before, .cart::after { content: ""; position: absolute; bottom: -5px; width: 8px; height: 8px; background: var(--bg); border: 2px solid var(--amber); border-radius: 50%; }
.cart::before { left: 4px; } .cart::after { right: 4px; }
.cart-lbl { position: absolute; top: -22px; left: 50%; transform: translateX(-50%); font-size: 10px; letter-spacing: .1em; color: var(--amber); white-space: nowrap; }

.stage { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .stage { grid-template-columns: minmax(0, 1fr); } .rn { width: 56px; font-size: 11px; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
.card.flat { background: var(--bg2); }
.board { display: grid; gap: 14px; }
.board h2 { font-size: 26px; line-height: 1.2; }
.side { display: grid; gap: 12px; }
.task { display: flex; gap: 12px; align-items: flex-start; background: rgba(53,198,217,.14); border: 1.5px solid var(--accent); border-radius: 10px; padding: 12px 14px; font-size: 18px; }
.task .ico { font-size: 20px; color: var(--accent); line-height: 1.3; }
.task b { display: block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
.hintbtn { display: block; padding: 4px 0 0; color: var(--accent); font-size: 15px; }
.hintline { margin-top: 6px; font-size: 16px; color: var(--fg); } .hintline b { color: var(--amber); display: inline; font-size: inherit; letter-spacing: 0; text-transform: none; }
.info { display: block; padding: 2px 0; font-size: 15px; color: var(--mute); }
.info .ico { display: none; }

.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 12px 20px; font-weight: 700; font-size: 17px; transition: box-shadow .2s, transform .1s; }
.btn:hover { box-shadow: 0 0 18px rgba(53,198,217,.45); }
.btn:active { transform: translateY(1px); }
.btn:disabled { background: var(--line); color: var(--mute); cursor: not-allowed; box-shadow: none; }
.btn.ghost { background: transparent; color: var(--fg); border: 1.5px solid var(--line); }
.btn.ghost:hover { border-color: var(--accent); box-shadow: none; }
.btn.small { padding: 8px 14px; font-size: 15px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; width: 100%; background: var(--bg2); border: 2px solid var(--line); border-radius: 10px; padding: 13px 16px; display: block; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: rgba(53,198,217,.08); }
.opt:disabled { cursor: default; }
.opt .t { font-weight: 700; }
.opt .d { font-size: 14px; color: var(--mute); margin-top: 2px; }
.opt.ok { border-color: var(--good); background: var(--good-bg); }
.opt.no { border-color: var(--bad); background: var(--bad-bg); }
.opt.dim { opacity: .55; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tri { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 620px) { .pair, .tri { grid-template-columns: minmax(0, 1fr); } }
.letters { display: flex; gap: 8px; flex-wrap: wrap; }
.letter { width: 58px; height: 58px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg2); font-family: var(--mono); font-size: 26px; font-weight: 700; }
.letter:hover:not(:disabled) { border-color: var(--accent); }
.letter.ok { border-color: var(--good); background: var(--good-bg); }
.letter.no { border-color: var(--bad); background: var(--bad-bg); }
.letter:disabled { cursor: default; }
.letter:disabled:not(.ok):not(.no) { opacity: .5; }
.lbl { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); display: block; margin-bottom: 6px; font-weight: 700; }

.fb { display: grid; gap: 8px; }
.fb .l { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 10px; font-size: 16px; border: 1.5px solid; }
.fb .l.ok { background: var(--good-bg); border-color: var(--good); }
.fb .l.no { background: var(--bad-bg); border-color: var(--bad); }
.fb .ic { font-weight: 800; font-size: 18px; line-height: 1.3; }
.fb .l.ok .ic { color: var(--good); } .fb .l.no .ic { color: var(--bad); }
.fb .pt { margin-left: auto; font-family: var(--mono); font-size: 13px; white-space: nowrap; color: var(--mute); padding-top: 3px; }

.qc { background: #0a131c; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.qc .hd { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-bottom: 6px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.qc .ln { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px dashed var(--line); font-size: 17px; flex-wrap: wrap; }
.qc .v { font-family: var(--mono); font-size: 15px; display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.badge { padding: 2px 9px; border-radius: 5px; font-size: 13px; font-weight: 700; }
.badge.ok { background: var(--good-bg); color: var(--good); border: 1px solid var(--good); }
.badge.w { background: var(--bad-bg); color: var(--bad); border: 1px solid var(--bad); }
.rule { margin-top: 8px; font-size: 15px; color: var(--amber); border-top: 1px dashed var(--line); padding-top: 10px; }

.align { --cw: 21px; overflow-x: auto; padding-bottom: 8px; }
@media (max-width: 860px) { .align { --cw: clamp(17px, calc((100vw - 90px) / 33), 26px); } }
.agrid { width: calc(var(--cw) * var(--cols)); position: relative; }
.arow { height: calc(var(--cw) + 4px); position: relative; }
.rowlbl { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); margin: 10px 0 4px; font-weight: 700; }
.cell { position: absolute; top: 0; width: var(--cw); height: var(--cw); display: grid; place-items: center; font-family: var(--mono); font-weight: 700; font-size: calc(var(--cw) * .56); border: 1.5px solid var(--line); background: var(--bg2); }
.cell.ref { background: rgba(53,198,217,.16); border-color: rgba(53,198,217,.5); }
.cell.sm { background: #e9eff3; color: #0c1722; border-color: #fff; }
.cell.diff { background: var(--amber); color: var(--amber-ink); border: 3px solid #fff; z-index: 2; }
.strip { position: absolute; top: 0; left: 0; width: calc(var(--cw) * var(--len)); height: calc(var(--cw) + 4px); cursor: grab; touch-action: none; transition: transform .35s ease; border-radius: 4px; }
.strip.drag { transition: none; cursor: grabbing; }
.nums .n { position: absolute; width: var(--cw); text-align: center; font-size: 10px; color: var(--mute); font-family: var(--mono); }
.nums .n.hot { color: var(--amber); font-weight: 800; font-size: 12px; }
.mk { position: absolute; width: var(--cw); text-align: center; font-family: var(--mono); font-weight: 800; font-size: calc(var(--cw) * .6); height: var(--cw); line-height: var(--cw); color: var(--mute); }
.mk.x { color: var(--amber); }
.status { font-size: 15px; padding: 5px 12px; border-radius: 8px; background: var(--bg2); border: 1px solid var(--line); }
.status.good { color: var(--good); border-color: var(--good); }
.slide-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.mini-note { font-size: 14px; color: var(--mute); }

.seq { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 8px; }
.sq { width: 24px; text-align: center; font-family: var(--mono); }
.sq b { display: grid; place-items: center; height: 28px; border: 1px solid var(--line); background: var(--bg2); font-size: 14px; }
.sq.hl b { background: var(--amber); color: var(--amber-ink); border: 2px solid #fff; }
.sq.n b { color: var(--bad); border-color: var(--bad); }
.sq .qw { height: 30px; display: flex; align-items: flex-end; justify-content: center; margin-top: 4px; }
.sq .qb { display: block; width: 10px; border-radius: 2px; background: var(--good); }
.sq.low .qb { background: var(--bad); }
.sq .pn { font-size: 9px; color: var(--mute); margin-top: 3px; }
.cartcard { border: 1px solid var(--accent); background: var(--bg2); }
.cartcard p { font-size: 14px; color: var(--mute); margin-top: 8px; }
.who { font-size: 13px; color: var(--accent); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; font-weight: 700; }

.ours { background: var(--warn-bg); border: 1.5px solid var(--amber); border-radius: 10px; padding: 10px 14px; font-family: var(--mono); font-size: 17px; }
.lib { background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; }
.lib .hd { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.entry { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-family: var(--mono); font-size: 16px; }
.entry .tag { font-family: var(--body); font-size: 13px; font-weight: 700; color: var(--amber); }
.entry.hit { border-color: var(--amber); }
.dots { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--mute); }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); display: inline-block; font-style: normal; }
.dots i.on { background: var(--accent); } .dots i.dn { background: var(--good); } .dots i.bd { background: var(--bad); }
.clue { background: var(--bg2); border: 2px solid var(--accent); border-radius: 10px; padding: 14px 16px; display: grid; gap: 8px; }
.clue .hd { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; letter-spacing: .1em; font-family: var(--mono); color: var(--accent); }
.clue .tx { font-size: 20px; font-family: var(--display); line-height: 1.3; }
.clue .tells { font-size: 15px; color: var(--mute); border-top: 1px dashed var(--line); padding-top: 8px; }
.clue .tells b { color: var(--fg); }
.legend { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
@media (max-width: 620px) { .legend { grid-template-columns: minmax(0, 1fr); } }
.legend div { padding: 7px 9px; border-radius: 8px; font-size: 13px; border: 1px solid var(--line); background: var(--bg2); }
.legend b { display: block; }

.sheet { background: #e9eff3; color: #0c1722; border-radius: 10px; padding: 16px; font-size: 15px; }
.sheet .hd { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.sheet h3 { font-size: 18px; }
.sheet .ln { display: grid; grid-template-columns: 128px 1fr; gap: 10px; padding: 7px 0; border-top: 1px solid #b9c8d3; }
.sheet .ln b { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #36526a; padding-top: 2px; }
@media (max-width: 520px) { .sheet .ln { grid-template-columns: 1fr; gap: 2px; } }
.reply { border-radius: 10px; padding: 14px 16px; border: 1.5px solid; }
.reply.best { background: var(--good-bg); border-color: var(--good); }
.reply.over { background: var(--bad-bg); border-color: var(--bad); }
.reply.under { background: var(--warn-bg); border-color: var(--amber); }
.reply q { font-size: 18px; font-family: var(--display); display: block; quotes: none; }
details.learn summary { cursor: pointer; font-weight: 700; color: var(--accent); }
details.learn p { margin-top: 8px; font-size: 15px; color: var(--mute); }

.hero { position: relative; isolation: isolate; padding: 6px 0 20px; min-height: 245px; overflow: hidden; border-radius: 18px; }
.hero h1 { font-size: clamp(34px, 6vw, 58px); line-height: 1.04; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero p.lead { max-width: 60ch; color: var(--mute); margin-top: 12px; font-size: 19px; }
/* Soft DNA illustration behind the intro text. Inline SVG keeps this game fully offline. */
.hero-art { position: absolute; inset: 0; z-index: -1; display: block; overflow: hidden; opacity: .22; pointer-events: none; background: radial-gradient(ellipse at 78% 38%, rgba(53,198,217,.16), transparent 58%); }
.hero-art svg { display: block; position: absolute; width: min(100%, 520px); height: 100%; right: 0; top: 0; }
.hero > :not(.hero-art) { position: relative; z-index: 1; }
@media (max-width: 640px) { .hero { min-height: 225px; } .hero-art svg { width: 100%; opacity: .9; } }
.steps5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 760px) { .steps5 { grid-template-columns: minmax(0, 1fr); } }
.steps5 div { background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 15px; }
.steps5 b { display: block; font-family: var(--mono); color: var(--accent); font-size: 13px; }
.go { font-size: 22px; padding: 16px 34px; }
.cases { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 640px) { .cases { grid-template-columns: minmax(0, 1fr); } }
.cases .opt { padding: 9px 12px; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: rgba(53,198,217,.14); }
.score { font-family: var(--display); font-size: clamp(54px, 10vw, 90px); line-height: 1; color: var(--accent); }
.seal { display: inline-grid; place-items: center; text-align: center; width: 150px; height: 150px; border-radius: 50%; border: 3px double var(--amber); color: var(--amber); font-family: var(--display); font-weight: 700; font-size: 17px; line-height: 1.15; transform: rotate(-8deg); padding: 10px; }
table.bd { width: 100%; border-collapse: collapse; font-size: 16px; }
table.bd td, table.bd th { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; }
table.bd td:not(:first-child), table.bd th:not(:first-child) { text-align: right; font-family: var(--mono); }
table.bd th { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<body>
<div id="app"></div>
<script>
(function () {
"use strict";
var root = document.getElementById("app");
var LET = ["A", "T", "G", "C"];
var PL = 3, OMIN = -3, OMAX = 5;
var ARW = "→";

/* ============ DATA (all simulated) ============ */
function lcg(seed) { var x = seed; return function () { x = (x * 1103515245 + 12345) & 0x7fffffff; return x / 0x7fffffff; }; }
function qualHigh(n, seed) { var r = lcg(seed), a = []; for (var i = 0; i < n; i++) a.push(34 + Math.round(r() * 6)); return a; }
function qualLow(n, seed) { var r = lcg(seed), a = []; for (var i = 0; i < n; i++) a.push(3 + Math.round(r() * 12)); return a; }
function T(s, c) {
  return s.replace(/\{pos\}/g, c.pos).replace(/\{from\}/g, c.from).replace(/\{to\}/g, c.to).replace(/\{alt\}/g, c.alt)
    .replace(/\{drug\}/g, c.drug).replace(/\{org\}/g, c.org).replace(/\{other\}/g, "Bacterium alpha").replace(/\{odrug\}/g, "Drug Z").replace(/\{ARW\}/g, ARW);
}
/* One rule decides how strong a piece of evidence is. */
function rate(a) {
  if (!a.effect) return "NE";
  if (a.change === "exact" && a.species === "ours" && a.drug === "ours" && a.tested) return "SUP";
  return "UNC";
}
function whyOf(a) {
  if (!a.effect) return "It does not say what the change does, so it does not help yet.";
  if (a.change === "different") return "It is about a different change, not ours. It is only a hint.";
  if (a.change === "area") return "It is about a whole area, not our exact change. It is only a hint.";
  if (a.species !== "ours") return "It is about a different bacterium, so it may not apply to ours. It is only a hint.";
  if (a.drug !== "ours") return "It is about a different drug, so it may not apply to ours. It is only a hint.";
  if (!a.tested) return "It has not been properly tested or confirmed yet. It is only a hint.";
  return "It is about our exact change, bacteria and drug, and it was tested. That is strong evidence.";
}
var OURS = { effect: true, change: "exact", species: "ours", drug: "ours", tested: true };
var EV = {
  obs: { text: "Our sample's DNA differs from the reference at position {pos}: {from} {ARW} {to}.", tells: "The DNA is different here. It does not say what the difference does.", a: { effect: false, change: "exact", species: "ours", drug: "ours", tested: false } },
  nolib: { text: "The clue library has no entry for position {pos}.", tells: "Nobody has recorded this spot yet. That says nothing about what our change does.", a: { effect: false, change: "none", species: "ours", drug: "ours", tested: false } },
  near: { text: "The clue library lists a different change at position {pos}: {from} {ARW} {alt}. Ours is {from} {ARW} {to}.", tells: "It is about a different change at the same spot.", a: { effect: true, change: "different", species: "ours", drug: "ours", tested: true } },

    if (k === "report" && p.pick === null) return;
    if (k === "stop" && p.pick === null) return;
    if (k === "weigh") {
      if (p.p[c.ev[p.i].id] === undefined) return;
      if (p.i + 1 < c.ev.length) { p.i++; render(); window.scrollTo(0, 0); return; }
    }
    advance();
  },
  pick: function (d) { var c = C(), p = S.d.qc; if (p.pick !== null) return; p.pick = d.v; setPts("qc", d.v === (c.warn ? "attn" : "ok") ? 1 : 0); render(); },
  lineup: function () { playAlign(); },
  nudgeL: function () { if (!S.anim) { S.off = Math.max(OMIN, S.off - 1); refreshAlign(); } },
  nudgeR: function () { if (!S.anim) { S.off = Math.min(OMAX, S.off + 1); refreshAlign(); } },
  letter: function (d) {
    var c = C(), p = S.d.align, di = diffIdx(c), f = d.f; if (p[f] !== null || S.off !== 0) return;
    p[f] = d.v; var truth = f === "ref" ? c.ref[di] : c.smp[di];
    setPts(f === "ref" ? "al_ref" : "al_smp", d.v === truth ? 1 : 0); render();
  },
  pick1: function (d) { var c = C(), p = S.d.scan; if (p.s1 !== null) return; p.s1 = d.v; setPts("sc1", d.v === scanTruth(c) ? 1 : 0); render(); },
  pick2: function (d) {
    var c = C(), p = S.d.scan; if (p.s1 === null || p.s2 !== null) return;
    var o = scan2Opts(scanTruth(c))[+d.v]; p.s2 = +d.v; setPts("sc2", o.k === "best" ? 1 : 0); render();
  },
  pickEv: function (d) {
    var c = C(), p = S.d.weigh, e = c.ev[p.i]; if (p.p[e.id] !== undefined) return;
    p.p[e.id] = d.v; setPts("wg" + p.i, d.v === e.ans ? 1 : 0); render();
  },
  pickConc: function (d) { var c = C(), p = S.d.report; if (p.pick !== null) return; p.pick = +d.v; setPts("rp", CONC[conclKey(c)][+d.v].pts); render(); },
  pickStop: function (d) { var p = S.d.stop; if (p.pick !== null) return; p.pick = +d.v; setPts("stop", STOP_OPTS[+d.v].pts); render(); }
};
root.addEventListener("click", function (e) {
  var b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  var fn = ACT[b.dataset.act];
  if (fn) fn(b.dataset);
});
root.addEventListener("toggle", function (e) {
  var t = e.target;
  if (t && t.classList && t.classList.contains("learn")) S.learn[t.getAttribute("data-k")] = t.open;
  if (t && t.id === "cm") S.cmOpen = t.open;
}, true);
window.DD = { CASES: CASES, ROT: ROT, scanTruth: scanTruth, diffIdx: diffIdx, rate: rate, state: function () { return S; } };
render();
})();
</script>
